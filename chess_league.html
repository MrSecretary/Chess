<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Turnierverwaltung</title>
<style>
body { font-family: Arial; background:#000;color:#fff; margin:0; padding:0;}
header { background:#c0392b; padding:10px; display:flex; align-items:center;}
header img { height:50px; margin-right:20px;}
header h1 { margin:0; }
nav button { margin-left:10px; padding:5px 10px; cursor:pointer; }
section { padding:20px;}
textarea, input[type=text] { width:100%; }
table { width:100%; border-collapse: collapse; margin-top:10px;}
table, th, td { border:1px solid #fff; text-align:center; }
th, td { padding:8px; }
button { padding:5px 10px; margin-top:5px; cursor:pointer;}
#logoutBtn { background:#fff; color:#c0392b; border:none;}
</style>
</head>
<body>

<header>
    <img id="logoPreview" src="" alt="Logo">
    <h1>Turnierverwaltung</h1>
    <nav id="adminNav" style="display:none;">
        <button onclick="showSection('news')">News</button>
        <button onclick="showSection('players')">Tabelle</button>
        <button onclick="showSection('matches')">Matches</button>
        <button onclick="showSection('playoffs')">Playoffs</button>
        <button id="logoutBtn" onclick="logout()">Logout</button>
    </nav>
</header>

<section id="loginSection">
    <h2>Admin Login</h2>
    <input type="password" id="password" placeholder="Passwort">
    <button onclick="login()">Login</button>
</section>

<section id="newsSection" style="display:none;">
    <h2>News & Ankündigungen</h2>
    <textarea id="newsEditor" rows="5"></textarea><br>
    <button onclick="saveNews()">Speichern</button>
    <div id="newsDisplay" style="margin-top:10px;"></div>
</section>

<section id="playersSection" style="display:none;">
    <h2>Spieler Tabelle</h2>
    <button onclick="addPlayer()">Spieler hinzufügen</button>
    <table id="playersTable">
        <thead>
            <tr>
                <th>Rang</th>
                <th>Spielername</th>
                <th>Spiele</th>
                <th>Siege</th>
                <th>Unentschieden</th>
                <th>Niederlagen</th>
                <th>Punkte</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<section id="matchesSection" style="display:none;">
    <h2>Matches</h2>
    <button onclick="generateMatches()">Neue Matches generieren</button>
    <table id="matchesTable">
        <thead>
            <tr>
                <th>Spiel 1</th><th>Spiel 2</th><th>Ergebnis</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<section id="playoffsSection" style="display:none;">
    <h2>Playoffs</h2>
    <button onclick="generatePlayoffs()">Playoffs starten</button>
    <div id="playoffsDisplay" style="margin-top:10px;"></div>
</section>

<section>
    <h2>Kontakt</h2>
    <p>Email: <a href="mailto:f.frembs@is-neustadt.de">f.frembs@is-neustadt.de</a></p>
    <input type="file" id="logoUpload">
</section>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<script>
// Firebase konfigurieren
const firebaseConfig = {
    apiKey: "DEINE_API_KEY",
    authDomain: "deinprojekt.firebaseapp.com",
    projectId: "deinprojekt",
    storageBucket: "deinprojekt.appspot.com",
    messagingSenderId: "XXX",
    appId: "XXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

const ADMIN_PASSWORD = "5082";

function login(){
    if(document.getElementById("password").value === ADMIN_PASSWORD){
        localStorage.setItem("loggedIn","true");
        document.getElementById("loginSection").style.display="none";
        document.getElementById("adminNav").style.display="block";
        showSection('news');
        loadNews();
        loadPlayers();
        loadMatches();
    } else { alert("Falsches Passwort"); }
}

function logout(){ localStorage.removeItem("loggedIn"); location.reload(); }
if(localStorage.getItem("loggedIn")==="true"){ login(); }

function showSection(id){
    ['news','players','matches','playoffs'].forEach(s=>{
        document.getElementById(s+'Section').style.display = (s===id)?'block':'none';
    });
}

// --- News ---
async function saveNews(){
    const content = document.getElementById("newsEditor").value;
    await db.collection('news').doc('main').set({content});
    loadNews();
}
async function loadNews(){
    const doc = await db.collection('news').doc('main').get();
    if(doc.exists){
        document.getElementById("newsEditor").value = doc.data().content;
        document.getElementById("newsDisplay").innerHTML = doc.data().content.replace(/\n/g,'<br>');
    } else { document.getElementById("newsDisplay").innerHTML="Noch keine News."; }
}

// --- Spieler Tabelle ---
async function loadPlayers(){
    const snapshot = await db.collection('players').get();
    const tbody = document.querySelector('#playersTable tbody');
    tbody.innerHTML="";
    let players = [];
    snapshot.forEach(doc=>players.push({...doc.data(), id:doc.id}));
    // Punkte berechnen
    players.forEach(p=>{
        p.spiele = p.siege + p.unentschieden + p.niederlagen;
        p.punkte = p.siege*1 + p.unentschieden*0.5;
    });
    // Rang sortieren
    players.sort((a,b)=>b.punkte-a.punkte);
    players.forEach((p,i)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${i+1}</td>
            <td>${p.name}</td>
            <td>${p.spiele}</td>
            <td>${p.siege}</td>
            <td>${p.unentschieden}</td>
            <td>${p.niederlagen}</td>
            <td>${p.punkte}</td>`;
        tbody.appendChild(tr);
    });
}

async function addPlayer(){
    const name = prompt("Spielername:");
    if(!name) return;
    await db.collection('players').add({name, siege:0, unentschieden:0, niederlagen:0});
    loadPlayers();
}

// --- Matches ---
async function generateMatches(){
    const snapshot = await db.collection('players').get();
    let players=[];
    snapshot.forEach(doc=>players.push(doc.id));
    let pairs=[];
    for(let i=0;i<players.length;i+=2){
        if(players[i+1]) pairs.push([players[i],players[i+1]]);
    }
    // Zufälliges Ergebnis
    pairs.forEach(async p=>{
        let r=Math.random();
        let result;
        if(r<0.45){ result='Sieg Spieler1'; await updateScore(p[0],'sieg'); await updateScore(p[1],'niederlage'); }
        else if(r<0.9){ result='Sieg Spieler2'; await updateScore(p[1],'sieg'); await updateScore(p[0],'niederlage'); }
        else{ result='Unentschieden'; await updateScore(p[0],'unentschieden'); await updateScore(p[1],'unentschieden'); }
        await db.collection('matches').add({spieler1:p[0],spieler2:p[1],result,resultText:result,date:new Date()});
    });
    loadMatches();
}

async function loadMatches(){
    const snapshot = await db.collection('matches').orderBy('date').get();
    const tbody = document.querySelector('#matchesTable tbody');
    tbody.innerHTML="";
    snapshot.forEach(doc=>{
        const data = doc.data();
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${data.spieler1}</td><td>${data.spieler2}</td><td>${data.resultText}</td>`;
        tbody.appendChild(tr);
    });
}

// Spieler Punkte aktualisieren
async function updateScore(playerId,type){
    const doc = await db.collection('players').doc(playerId).get();
    const data = doc.data();
    if(type==='sieg') data.siege++; else if(type==='niederlage') data.niederlagen++; else data.unentschieden++;
    await db.collection('players').doc(playerId).set(data);
}

// --- Playoffs ---
async function generatePlayoffs(){
    const snapshot = await db.collection('players').get();
    let players=[];
    snapshot.forEach(doc=>players.push({...doc.data(),id:doc.id}));
    players.forEach(p=>p.punkte=p.siege+0.5*p.unentschieden);
    players.sort((a,b)=>b.punkte-a.punkte);
    let top4 = players.slice(0,4);
    let semifinals = [[top4[0],top4[3]],[top4[1],top4[2]]];
    let results="";
    semifinals.forEach((match,i)=>{
        let winner = Math.random()<0.5?match[0]:match[1];
        results+=`Halbfinale ${i+1}: ${match[0].name} vs ${match[1].name} → Sieger: ${winner.name}<br>`;
    });
    document.getElementById('playoffsDisplay').innerHTML = results;
}

// --- Logo Upload ---
document.getElementById('logoUpload').addEventListener('change',async function(e){
    const file = e.target.files[0];
    if(!file) return;
    const ref = storage.ref('logo/'+file.name);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    document.getElementById('logoPreview').src = url;
});

</script>
</body>
</html>
